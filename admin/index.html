<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>لوحة التحكم — الدفتر</title>
<link rel="icon" href="../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
/* ═══════════════════════════════════════════════════════════════════
   🎨 نظام التصميم
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --bg:#0a0f1e; --bg2:#0f172a; --card:#121a2e; --card2:#18223a; --line:#223052;
  --text:#e6ecff; --muted:#8b98b8; --dim:#5d6a8a;
  --blue:#3b82f6; --blue2:#2563eb; --indigo:#6366f1; --violet:#8b5cf6;
  --green:#10b981; --amber:#f59e0b; --red:#ef4444; --cyan:#06b6d4; --pink:#ec4899;
  --r:16px; --shadow:0 10px 30px rgba(0,0,0,.35);
  --side:rgba(10,15,30,.92); --hover:#1d2945; --line2:#34446e; --text2:#cbd5e1; --track:#2a3657;
  --glow1:rgba(99,102,241,.18); --glow2:rgba(6,182,212,.12); --rowhover:rgba(59,130,246,.06);
  color-scheme:dark;
}
/* ☀️ الوضع النهاري */
[data-theme=light]{
  --bg:#f3f6fb; --bg2:#ffffff; --card:#ffffff; --card2:#f2f5fb; --line:#e2e8f2;
  --text:#0f172a; --muted:#5b6785; --dim:#8a96b3;
  --shadow:0 10px 30px rgba(15,23,42,.08);
  --side:rgba(255,255,255,.92); --hover:#eef2fa; --line2:#cfd8e8; --text2:#334155; --track:#cbd5e1;
  --glow1:rgba(99,102,241,.10); --glow2:rgba(6,182,212,.08); --rowhover:rgba(59,130,246,.05);
  color-scheme:light;
}
[data-theme=light] .card{box-shadow:0 1px 2px rgba(15,23,42,.04)}
[data-theme=light] .b-trial{color:#b45309}  [data-theme=light] .b-business{color:#6d28d9}
[data-theme=light] .b-pro{color:#1d4ed8}    [data-theme=light] .b-expired{color:#b91c1c}
[data-theme=light] .b-free{color:#475569}   [data-theme=light] .b-ok,[data-theme=light] .b-live{color:#047857}
[data-theme=light] .b-warn{color:#b45309}   [data-theme=light] .b-next{color:#4338ca}
[data-theme=light] .banner{color:#92400e} [data-theme=light] .banner.info{color:#1e40af} [data-theme=light] .banner.red{color:#991b1b}
[data-theme=light] .msg.ok{color:#047857} [data-theme=light] .msg.err{color:#b91c1c}
[data-theme=light] .btn.danger{color:#b91c1c}
[data-theme=light] .login-card{background:rgba(255,255,255,.9)}
[data-theme=light] .modal,[data-theme=light] .overlay{background:rgba(15,23,42,.35)}
.theme-btn{width:38px;height:38px;padding:0;justify-content:center;font-size:17px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(900px 500px at 85% -10%,var(--glow1),transparent 60%),
             radial-gradient(700px 400px at 0% 110%,var(--glow2),transparent 60%);z-index:0}
a{color:var(--blue);text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text);background:var(--bg2);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.18)}
textarea{resize:vertical;min-height:90px}
label.f{display:block;font-size:12.5px;color:var(--muted);margin:0 0 6px;font-weight:600}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

/* أزرار */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card2);
  color:var(--text);padding:9px 16px;border-radius:10px;font-weight:600;font-size:13.5px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--line2);background:var(--hover)}
.btn.primary{background:linear-gradient(135deg,var(--blue),var(--indigo));border-color:transparent;color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.green{background:var(--green);border-color:transparent;color:#04241a}
.btn.danger{background:transparent;border-color:rgba(239,68,68,.5);color:#fca5a5}
.btn.danger:hover{background:rgba(239,68,68,.12)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--card2)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.5;pointer-events:none}

/* ═══ تسجيل الدخول ═══ */
#login{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{width:100%;max-width:420px;background:rgba(18,26,46,.85);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:24px;padding:36px 32px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--blue),var(--indigo));
  display:grid;place-items:center;box-shadow:0 6px 18px rgba(59,130,246,.4)}
.logo svg{width:26px;height:26px}
.brand h1{font-size:22px;font-weight:800}
.brand small{display:block;color:var(--muted);font-size:12.5px;font-weight:500;margin-top:-4px}
.login-card p.sub{color:var(--muted);margin:14px 0 22px;font-size:13.5px}
.or{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:12px;margin:18px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.msg{margin-top:14px;padding:11px 14px;border-radius:10px;font-size:13px;display:none}
.msg.ok{display:block;background:rgba(16,185,129,.12);color:#6ee7b7;border:1px solid rgba(16,185,129,.3)}
.msg.err{display:block;background:rgba(239,68,68,.1);color:#fca5a5;border:1px solid rgba(239,68,68,.3)}

/* ═══ الهيكل ═══ */
#shell{position:relative;z-index:1;display:none;min-height:100vh}
aside{position:fixed;top:0;right:0;bottom:0;width:250px;background:var(--side);backdrop-filter:blur(10px);
  border-left:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;z-index:20}
aside .brand{padding:0 8px 22px;border-bottom:1px solid var(--line);margin-bottom:14px}
nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:var(--muted);
  font-weight:600;margin-bottom:3px;transition:.15s;position:relative}
nav a svg{width:19px;height:19px;flex:none}
nav a:hover{color:var(--text);background:var(--card)}
nav a.active{color:var(--text);background:linear-gradient(135deg,rgba(59,130,246,.22),rgba(99,102,241,.16));}
nav a.active::before{content:"";position:absolute;right:-14px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--blue)}
nav .sec{font-size:11px;color:var(--dim);font-weight:700;letter-spacing:.3px;margin:16px 14px 6px}
.side-foot{margin-top:auto;padding:14px 8px 0;border-top:1px solid var(--line)}
.me{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--pink));
  display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.me b{display:block;font-size:13px}.me span{display:block;font-size:11.5px;color:var(--muted);direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}

main{margin-right:250px;padding:26px 32px 60px;min-height:100vh}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.topbar h2{font-size:24px;font-weight:800}
.topbar .crumb{color:var(--muted);font-size:13px}
.topbar .grow{flex:1}
.search{position:relative;width:300px}
.search input{padding-right:38px;background:var(--card)}
.search svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--dim)}
.burger{display:none}

/* بطاقات */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
.g21{grid-template-columns:2fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;position:relative;overflow:hidden}
.card h3{font-size:15px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.card .hint{color:var(--muted);font-size:12.5px;margin-bottom:14px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.kpi{padding:18px 20px}
.kpi .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;margin-bottom:12px}
.kpi .ic svg{width:21px;height:21px}
.kpi .v{font-size:28px;font-weight:800;line-height:1.1}
.kpi .l{color:var(--muted);font-size:12.5px;font-weight:600;margin-top:4px}
.kpi .d{position:absolute;top:18px;left:18px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:20px}
.kpi::after{content:"";position:absolute;inset:auto -40px -60px auto;width:140px;height:140px;border-radius:50%;opacity:.07;background:currentColor}
.chart-box{position:relative;height:260px}
.chart-box.sm{height:220px}

/* شارات */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-trial{background:rgba(245,158,11,.14);color:#fcd34d}
.b-business{background:rgba(139,92,246,.18);color:#c4b5fd}
.b-pro{background:rgba(59,130,246,.16);color:#93c5fd}
.b-expired{background:rgba(239,68,68,.13);color:#fca5a5}
.b-free{background:rgba(139,152,184,.16);color:var(--text2)}
.b-ok{background:rgba(16,185,129,.14);color:#6ee7b7}
.b-warn{background:rgba(245,158,11,.14);color:#fcd34d}
.b-live{background:rgba(16,185,129,.14);color:#6ee7b7}
.b-next{background:rgba(99,102,241,.16);color:#a5b4fc}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}

/* جداول */
.table-wrap{overflow:auto;border-radius:12px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:center;font-size:12px;color:var(--muted);font-weight:700;padding:12px 14px;background:var(--card2);white-space:nowrap;position:sticky;top:0}
td{padding:13px 16px;border-top:1px solid var(--line);vertical-align:middle;text-align:center}
th:first-child,td:first-child,th.t,td.t{text-align:right}
td{white-space:nowrap} td.t:not(:first-child){white-space:normal}
.table-wrap>table{min-width:760px}
.drawer .table-wrap>table{min-width:0}
.drawer td,.drawer th{padding:11px 10px}
.who b,.who span{white-space:nowrap}
td.num,th.num{direction:rtl;unicode-bidi:normal}
td .who{display:inline-block;text-align:inherit}
td .badge{margin:0 auto}
th{padding:13px 16px}
tr.click{cursor:pointer;transition:.12s}
tr.click:hover td{background:var(--rowhover)}
.who b{display:block;font-weight:700}
.who span{display:block;font-size:12px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}

/* فلاتر */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--muted);padding:7px 14px;border-radius:30px;font-weight:600;font-size:13px}
.chip:hover{color:var(--text)}
.chip.on{background:var(--blue2);border-color:var(--blue2);color:#fff}
.chip .c{opacity:.7;margin-right:4px}

/* درج التفاصيل */
.overlay{position:fixed;inset:0;background:rgba(2,6,23,.6);backdrop-filter:blur(3px);z-index:40;opacity:0;pointer-events:none;transition:.2s}
.overlay.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(560px,100%);background:var(--bg2);border-right:1px solid var(--line);
  z-index:41;transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.drawer.on{transform:none}
.drawer-head{padding:22px 24px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center}
.drawer-body{padding:20px 24px;overflow:auto;flex:1}
.drawer-head .avatar{width:48px;height:48px;font-size:19px}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
.kv div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.kv b{display:block;font-size:17px;font-weight:800}
.kv span{font-size:12px;color:var(--muted)}
.section-t{font-size:13px;font-weight:800;color:var(--muted);margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.checks li{list-style:none;display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.checks li:last-child{border:0}
.ci{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:12px;font-weight:800}
.ci.ok{background:rgba(16,185,129,.18);color:#6ee7b7}.ci.no{background:rgba(239,68,68,.16);color:#fca5a5}.ci.wa{background:rgba(245,158,11,.16);color:#fcd34d}

/* نماذج */
.row{display:flex;gap:12px}.row>*{flex:1}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:8px;border-radius:8px;font-weight:700}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.switch{position:relative;width:44px;height:24px;flex:none}
.switch input{display:none}
.switch span{position:absolute;inset:0;background:var(--track);border-radius:20px;transition:.2s}
.switch span::after{content:"";position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span::after{transform:translateX(-20px)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.preview-box{background:linear-gradient(135deg,rgba(16,185,129,.12),rgba(6,182,212,.08));border:1px solid rgba(16,185,129,.3);
  border-radius:12px;padding:12px 14px;font-weight:700;text-align:center;margin:12px 0}
.form-actions{display:flex;gap:10px;justify-content:flex-start;margin-top:16px;flex-wrap:wrap}

/* هاتف معاينة */
.phone{width:280px;margin:auto;background:#000;border-radius:38px;padding:12px;border:1px solid #2a3657;box-shadow:var(--shadow)}
.phone .scr{background:linear-gradient(160deg,#1e1b4b,#0f766e);border-radius:28px;height:430px;padding:46px 12px 12px;position:relative}
.phone .time{position:absolute;top:14px;left:0;right:0;text-align:center;color:#fff;font-weight:700;font-size:13px}
.notif{background:rgba(255,255,255,.95);color:#0f172a;border-radius:16px;padding:11px 12px;display:flex;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.notif .ap{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--blue),var(--indigo));display:grid;place-items:center;flex:none}
.notif .ap svg{width:20px;height:20px}
.notif b{display:block;font-size:13px}.notif p{font-size:12.5px;color:#334155;line-height:1.5;word-break:break-word}
.notif small{font-size:11px;color:#64748b}

/* شريط تقدّم */
.bar{height:10px;background:var(--bg2);border-radius:10px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* إشعارات منبثقة ونوافذ */
#toasts{position:fixed;bottom:22px;left:22px;z-index:60;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--card2);border:1px solid var(--line);border-right:4px solid var(--green);padding:12px 16px;border-radius:12px;
  box-shadow:var(--shadow);min-width:260px;max-width:380px;animation:tin .25s ease}
.toast.err{border-right-color:var(--red)}
@keyframes tin{from{transform:translateY(12px);opacity:0}}
.modal{position:fixed;inset:0;display:none;place-items:center;z-index:55;background:rgba(2,6,23,.65);backdrop-filter:blur(3px);padding:20px}
.modal.on{display:grid}
.modal .box{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:24px;max-width:440px;width:100%;box-shadow:var(--shadow)}
.modal h4{font-size:17px;margin-bottom:8px}
.modal p{color:var(--muted);margin-bottom:18px}

.banner{display:flex;gap:12px;align-items:flex-start;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.35);
  color:#fde68a;border-radius:14px;padding:14px 16px;margin-bottom:18px;font-size:13.5px}
.banner.info{background:rgba(59,130,246,.1);border-color:rgba(59,130,246,.35);color:#bfdbfe}
.banner.red{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.35);color:#fecaca}
.skel{background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200% 100%;
  animation:sk 1.2s infinite;border-radius:12px;min-height:110px}
@keyframes sk{to{background-position:-200% 0}}
.list-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border:0}
.list-item .avatar{width:34px;height:34px;font-size:13px}
.list-item .grow{flex:1;min-width:0}
.list-item b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item span{font-size:12px;color:var(--muted)}
.gauge{position:relative;width:180px;height:180px;margin:6px auto}
.gauge .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.gauge .c b{font-size:30px;font-weight:800;display:block;line-height:1}
.gauge .c span{font-size:12px;color:var(--muted)}
.heat{display:grid;grid-template-columns:62px repeat(24,1fr);gap:3px;font-size:10.5px;color:var(--muted);direction:rtl}
.heat .c{aspect-ratio:1;border-radius:4px;background:var(--card2)}
.heat .lb{display:flex;align-items:center;font-weight:600}
.heat .hh{text-align:center}
.funnel-row{display:grid;grid-template-columns:150px 1fr 120px;align-items:center;gap:12px;padding:8px 0}
.funnel-row .track{height:30px;background:var(--card2);border-radius:8px;overflow:hidden}
.funnel-row .fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--indigo),var(--blue));display:flex;align-items:center;padding:0 10px;color:#fff;font-weight:800;font-size:13px;min-width:34px}
.funnel-row .pc{font-size:12px;color:var(--muted);text-align:left}
.coh td{font-weight:700}
.trend-up{color:var(--green);font-weight:800}.trend-down{color:var(--red);font-weight:800}
.demo-flag{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:70;background:var(--amber);color:#1c1300;
  font-weight:800;font-size:12px;padding:5px 14px;border-radius:20px;box-shadow:var(--shadow)}

/* ═══ اللوحة الاحترافية ═══ */
nav{overflow:auto;flex:1;min-height:0;margin-bottom:8px}
.period{width:auto;flex:none} .period button{padding:6px 12px;font-size:12.5px;flex:none}
.kd{margin-top:8px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap} .kd span{color:var(--dim)}
.dl{font-weight:800;font-size:11.5px;padding:2px 8px;border-radius:20px;background:var(--card2);color:var(--muted)}
.dl.up{background:rgba(16,185,129,.14);color:#34d399} .dl.down{background:rgba(239,68,68,.13);color:#f87171}
[data-theme=light] .dl.up{color:#047857} [data-theme=light] .dl.down{color:#b91c1c}
.alerts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

.al.zero{opacity:.5}
.hb{display:flex;align-items:center;gap:8px;justify-content:center}
.hb-t{width:64px;height:7px;background:var(--card2);border-radius:6px;overflow:hidden} .hb-t i{display:block;height:100%;border-radius:6px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 20px;overflow:auto;flex:none}
.tabs button{border:0;background:none;color:var(--muted);font-weight:700;padding:12px 12px;border-bottom:2px solid transparent;white-space:nowrap;font-size:13.5px}
.tabs button:hover{color:var(--text)} .tabs button.on{color:var(--text);border-bottom-color:var(--blue)}
.drawer.wide{width:min(980px,100%)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px} .toolbar input{max-width:300px;background:var(--card)} .toolbar .grow{flex:1}
th[data-k]{cursor:pointer;user-select:none} th[data-k]:hover{color:var(--text)} th .ar{margin-right:4px;color:var(--blue)}
.abar{display:grid;grid-template-columns:minmax(150px,210px) 1fr 96px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.abar:last-child{border:0} .abar .tr{height:11px;background:var(--card2);border-radius:8px;overflow:hidden} .abar .tr i{display:block;height:100%;border-radius:8px}
.abar b{font-size:13px} .abar .v{font-size:12.5px;color:var(--muted);text-align:left}
.ring{border-radius:50%;display:grid;place-items:center;flex:none}
.ring>div{border-radius:50%;background:var(--bg2);display:grid;place-items:center;text-align:center}
.note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.note p{white-space:pre-wrap;font-size:13.5px;word-break:break-word} .note small{color:var(--muted);font-size:11.5px}
.soon{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;background:var(--card2);color:var(--muted);font-size:11px;font-weight:700}
.chip .c{margin-right:6px;opacity:.75;font-size:11.5px}

<script>
/* ═══════════════════════════════════════════════════════════════════

   ?demo=1 يعرض اللوحة ببيانات وهميّة، بلا اتصال، للمعاينة. */
const CFG = {

const DEMO = new URLSearchParams(location.search).has('demo');
const sb = DEMO ? null : supabase.createClient(CFG.url, CFG.anon, {

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n0 = v => Number(v || 0).toLocaleString('en-US');
const usd = v => '$' + Number(v || 0).toLocaleString('en-US', {maximumFractionDigits: 2});
const bytes = b => { b = Number(b||0); const u=['B','KB','MB','GB']; let i=0; while(b>=1024&&i<3){b/=1024;i++} return b.toFixed(b<10&&i?1:0)+' '+u[i]; };
const fdate = d => d ? new Date(d).toLocaleDateString('ar-SY-u-nu-latn', {year:'numeric',month:'short',day:'numeric'}) : '—';
const fdt = d => d ? new Date(d).toLocaleString('ar-SY-u-nu-latn', {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '—';
function ago(d){ if(!d) return '—'; const s=(Date.now()-new Date(d))/1000; const f=s<0; const a=Math.abs(s);
  const t = a<60?'لحظات':a<3600?Math.round(a/60)+' د':a<86400?Math.round(a/3600)+' س':Math.round(a/86400)+' يوم';
  return f ? 'بعد '+t : 'منذ '+t; }
const initial = s => (String(s||'؟').trim()[0]||'؟').toUpperCase();
const ERR = {
  NOT_ADMIN:'هذا الحساب ليس مشرفاً', INVALID_URL:'رابط التنزيل غير صالح', BUILD_WENT_BACKWARDS:'رقم البناء أقلّ من المنشور — لا يجوز النزول',

  INVALID_DAYS:'عدد الأيام بين 1 و365', EMPTY_MESSAGE:'العنوان والنصّ مطلوبان', MESSAGE_TOO_LONG:'العنوان حتى 80 حرفاً والنصّ حتى 500',

};
function errText(e){ const m = e?.message || String(e); for (const k in ERR) if (m.includes(k)) return ERR[k];
  if (/function .* does not exist|Could not find the function/i.test(m)) return 'دالّة غير موجودة في القاعدة — شغّل ملف SQL الخاصّ باللوحة';
  return m; }
function toast(t, err){ const el=document.createElement('div'); el.className='toast'+(err?' err':''); el.textContent=t; $('#toasts').appendChild(el); setTimeout(()=>el.remove(), err?6500:3800); }

    $('#modal').classList.add('on'); $('#mOk').onclick=()=>{$('#modal').classList.remove('on');res(true)}; $('#mNo').onclick=()=>{$('#modal').classList.remove('on');res(false)}; });
}

  if (DEMO) { await new Promise(r=>setTimeout(r,180)); return MOCK.rpc(name, params); }

const ico = (k, c='currentColor') => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;

const VIEWS = [

const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ═══ الوضع الليلي/النهاري ═══ */
function getTheme(){ try { const t = localStorage.getItem('daftar-admin-theme'); if (t) return t; } catch(e){}
  return matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; }
function applyTheme(t){ document.documentElement.dataset.theme = t; chartTheme();
  $$('.theme-btn').forEach(b => { b.textContent = t === 'light' ? '🌙' : '☀️'; b.title = t === 'light' ? 'الوضع الليلي' : 'الوضع النهاري'; }); }
function toggleTheme(){ const t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  try { localStorage.setItem('daftar-admin-theme', t); } catch(e){}
  applyTheme(t); if ($('#shell').style.display === 'block') route(); }
let charts = [];
function chart(id, cfg){ const el = document.getElementById(id); if(!el) return; const c = new Chart(el, cfg); charts.push(c); return c; }
function grad(ctx, a, b){ const g = ctx.createLinearGradient(0,0,0,260); g.addColorStop(0,a); g.addColorStop(1,b); return g; }

/* ═══════════════════════════════════════════════════════════════════

function buildNav(){
  $('#nav').innerHTML = VIEWS.map(v => `${v.sec?`<div class="sec">${v.sec}</div>`:''}<a href="#${v.id}" data-v="${v.id}">${ico(v.ic)}<span>${v.t}</span></a>`).join('');
}
async function route(){
  const id = (location.hash.slice(1).split('?')[0]) || 'home';
  const v = VIEWS.find(x => x.id === id) || VIEWS[0];
  $$('#nav a').forEach(a => a.classList.toggle('active', a.dataset.v === v.id));
  $('#title').textContent = v.t; $('#crumb').textContent = '';
  charts.forEach(c => c.destroy()); charts = [];
  $('#side').classList.remove('on');
  $('#view').innerHTML = `<div class="grid g4">${'<div class="skel"></div>'.repeat(4)}</div><div class="skel" style="margin-top:16px;min-height:300px"></div>`;
  try { await RENDER[v.id](); }
  catch(e){ console.error(e); $('#view').innerHTML = `<div class="banner red">⚠️ <div><b>تعذّر التحميل</b><br>${esc(errText(e))}</div></div>`; }

async function pushTo(ids, title, body){
  // الإشعار الفوريّ على الهاتف — يحتاج نسخة send-notification التي تقبل المشرف.
  if (DEMO || !ids.length) return {sent: ids.length, failed: 0, blocked: false};
  let sent = 0, failed = 0, blocked = false;
  const q = [...ids];
  const worker = async () => { while (q.length && !blocked) { const id = q.shift();
    const { data, error } = await sb.functions.invoke('send-notification', {body:{targetUserId:id, title, body, type:'general', skipStore:true}});
    if (error) { failed++; if (String(error.context?.status||error.message).includes('403')) blocked = true; }
    else if ((data?.sent||0) > 0) sent++; } };
  await Promise.all([worker(), worker(), worker()]);
  return {sent, failed, blocked};
}

  let seg = 'all';
  const counts = { all:null };
  try { const all = await rpc('admin_users_v2', {p_search:'', p_filter:'all'}) || [];
    counts.all = all.length; counts.merchants = all.filter(u=>u.is_merchant).length; counts.clients = all.filter(u=>u.is_client&&!u.is_merchant).length;
    counts.trial = all.filter(u=>u.status==='trial').length; counts.paid = all.filter(u=>['pro','business'].includes(u.status)).length; counts.expired = all.filter(u=>u.status==='expired').length;
  } catch(e){}
  const aud = () => $('#bAud').textContent = counts[seg]!=null ? `سيستلمها ${n0(counts[seg])} مستخدم` : '';
  $$('#sChips .chip').forEach(b => b.onclick = () => { seg=b.dataset.s; $$('#sChips .chip').forEach(x=>x.classList.toggle('on',x===b)); aud(); }); aud();
  const sync = () => { $('#pvT').textContent = $('#bT').value || 'العنوان'; $('#pvB').textContent = $('#bB').value || 'نصّ الرسالة يظهر هنا'; $('#bCount').textContent = $('#bB').value.length + ' / 500'; };
  $('#bT').oninput = sync; $('#bB').oninput = sync;
  $('#bGo').onclick = async () => {
    const t = $('#bT').value.trim(), b = $('#bB').value.trim();
    if (!t || !b) return toast('العنوان والنصّ مطلوبان', true);
    if (!await confirmBox('إرسال الرسالة', `إلى «${esc(SEG.find(x=>x[0]===seg)[1])}»${counts[seg]!=null?` — ${n0(counts[seg])} مستخدم`:''}.<br>لا يمكن سحبها بعد الإرسال.`, 'إرسال')) return;
    $('#bGo').disabled = true; $('#bRes').innerHTML = '<div class="banner info" style="margin-top:14px">⏳ جارٍ الإرسال…</div>';
    try {
      const r = await rpc('admin_broadcast', {p_segment:seg, p_title:t, p_body:b, p_user:null});
      let line = `✅ حُفظت لـ ${n0(r.count)} مستخدم في مركز الإشعارات.`;
      if ($('#bPush').checked && r.count) {
        $('#bRes').innerHTML = `<div class="banner info" style="margin-top:14px">⏳ حُفظت · جارٍ الإرسال إلى الجوالات…</div>`;
        const p = await pushTo(r.user_ids||[], t, b);
        line += p.blocked ? `<br>⚠️ الإشعار الفوري متوقّف: دالّة send-notification تحتاج التحديث الذي يسمح للمشرف (انظر دليل اللوحة).`
                          : `<br>📲 وصلت إلى جوالات ${n0(p.sent)} مستخدم${p.failed?` · تعذّر ${n0(p.failed)} (بلا جهاز مسجّل غالباً)`:''}.`;
      }
      $('#bRes').innerHTML = `<div class="banner info" style="margin-top:14px;color:#a7f3d0;border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.08)"><div>${line}</div></div>`;
      $('#bT').value=''; $('#bB').value=''; sync(); loadHist();
    } catch(e){ $('#bRes').innerHTML = `<div class="banner red" style="margin-top:14px">${esc(errText(e))}</div>`; }
    $('#bGo').disabled = false;
  };
};

/* ═══════════════════════════════════════════════════════════════════

   ═══════════════════════════════════════════════════════════════════ */
const ACT = {grant_plan:['منح خطّة','b-ok'],revoke_plan:['سحب خطّة','b-expired'],grant_plan_bulk:['منح جماعي','b-ok'],set_release:['نشر إصدار','b-pro'],
  set_config:['تغيير إعداد','b-next'],extend_trial:['تمديد تجربة','b-trial'],broadcast:['رسالة','b-business'],update_subscription:['تعديل اشتراك','b-warn']};
function actDetails(a){ const d = a.details || {};
  switch(a.action){
    case 'grant_plan': return `${esc(d.from||'—')} ← <b>${esc(d.to)}</b> · ${esc(d.months)} شهر${d.amount!=null?' · '+usd(d.amount):''}${d.expires?' · حتى '+fdate(d.expires):''}`;
    case 'set_release': return `البناء #${esc(d.from_build)} ← <b>#${esc(d.to_build)}</b> · ${esc(d.version)}${d.mandatory?' · إلزامي':''}`;
    case 'set_config': return `<b>${esc(d.key)}</b>`;

  if (location.hash !== '#users') location.hash = '#users'; else RENDER.users(); }, 350); };

async function boot(){
  if (DEMO) {
    document.body.insertAdjacentHTML('beforeend','<div class="demo-flag">وضع المعاينة — بيانات وهميّة</div>');
    showShell({email:'admin@example.com'}, 'أحمد'); return;
  }
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) { $('#login').style.display = 'grid'; $('#shell').style.display = 'none'; return; }
  let isAdmin = false;
  try { isAdmin = await rpc('is_current_user_admin'); } catch(e){}
  if (!isAdmin) { await sb.auth.signOut(); $('#login').style.display='grid'; $('#shell').style.display='none';
    return lmsg('هذا الحساب ليس مشرفاً. ادخل بحساب المشرف.'); }
  let name = session.user.user_metadata?.full_name || session.user.email;
  try { const { data } = await sb.from('profiles').select('name').eq('id', session.user.id).maybeSingle(); if (data?.name) name = data.name; } catch(e){}
  showShell(session.user, name);
}
function showShell(user, name){
  $('#login').style.display = 'none'; $('#shell').style.display = 'block';
  $('#meName').textContent = name; $('#meMail').textContent = user.email || ''; $('#meAv').textContent = initial(name);
  buildNav(); route();
}
if (!DEMO) sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_IN' && $('#shell').style.display !== 'block') boot(); });

function delta(cur, prev){
  cur = +cur || 0; prev = +prev || 0;
  if (!prev && !cur) return '<span class="dl">—</span>';
  if (!prev) return '<span class="dl up">جديد</span>';
  const p = Math.round(100 * (cur - prev) / prev);
  return `<span class="dl ${p >= 0 ? 'up' : 'down'}">${p >= 0 ? '▲' : '▼'} ${Math.abs(p)}%</span>`;
}
function csvDownload(name, header, rows){
  // خلية تبدأ بـ = + - @ قد ينفّذها Excel كمعادلة (حقن CSV) — نُبطلها بفاصلة علويّة.
  const q = v => { let s = String(v ?? ''); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const blob = new Blob(['﻿' + [header, ...rows].map(r => r.map(q).join(',')).join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
const K = (v, l, ic, col, dl = '', sub = '') => `<div class="card kpi" style="color:${col}"><div class="ic" style="background:${col}22">${ico(ic, col)}</div>

function composeTo(ids, label){
  if (!ids.length) return toast('القائمة فارغة', true);
  $('#modalBox').innerHTML = `<h4>رسالة إلى ${esc(label)}</h4><p>${n0(ids.length)} مستخدم · تظهر في الجرس داخل التطبيق.</p>

    <div class="toggle-row"><b style="font-size:13px">وإشعاراً فورياً على الجوال</b><label class="switch"><input type="checkbox" id="cmP" checked><span></span></label></div>
    <div class="form-actions"><button class="btn primary" id="cmGo">إرسال</button><button class="btn ghost" id="cmNo">إلغاء</button></div>`;
  $('#modal').classList.add('on');
  $('#cmNo').onclick = () => $('#modal').classList.remove('on');
  $('#cmGo').onclick = async () => {
    const t = $('#cmT').value.trim(), b = $('#cmB').value.trim();
    if (!t || !b) return toast('العنوان والنصّ مطلوبان', true);
    $('#cmGo').disabled = true;
    try {
      const r = await rpc('admin_broadcast_users', {p_users: ids, p_title: t, p_body: b});
      let line = `✅ حُفظت لـ ${n0(r.count)} مستخدم`;
      if ($('#cmP').checked && r.count) { const p = await pushTo(r.user_ids || [], t, b);
        line += p.blocked ? ' · ⚠️ الإشعار الفوري متوقّف (send-notification قديمة)' : ` · 📲 وصلت لجوالات ${n0(p.sent)}`; }
      $('#modal').classList.remove('on'); toast(line);
    } catch(e){ toast(errText(e), true); $('#cmGo').disabled = false; }
  };
}

let UP = [], upF = 'all', upSort = {k:'created_at', dir:-1};
const UPF = [['all','الكل'],['merchants','التجّار'],['clients','الزبائن'],['champion','أبطال'],['healthy','بخير'],['attention','يحتاج انتباهاً'],
  ['dormant','خامدون'],['never','لم يبدؤوا'],['paid','يدفعون'],['trial','الشهر المجاني'],['expiring','تنتهي خلال أسبوع'],['expired','منتهية'],['nodevice','بلا جهاز'],['admins','المشرفون']];
function upMatch(u, f){
  switch (f) {
    case 'all': return true;
    case 'merchants': return u.is_merchant;
    case 'clients': return u.is_client && !u.is_merchant;
    case 'paid': return u.paid;
    case 'trial': return u.status === 'trial';
    case 'expired': return u.status === 'expired';
    case 'nodevice': return !u.devices;
    case 'admins': return u.is_admin;
    case 'expiring': { const e = u.plan_expires_at || u.trial_ends_at; if (u.status === 'free' || !e) return false;
      const ms = new Date(e) - new Date(); return ms > 0 && ms < 7 * 864e5; }
    default: return u.segment === f;
  }
}
function upRows(){
  const q = (uSearch || '').toLowerCase(), k = upSort.k, s = upSort.dir;
  const val = u => k === 'last' ? (lastAct(u) || '') : k === 'name' ? (u.store_name || u.name || '') : (u[k] ?? -1);
  return UP.filter(u => upMatch(u, upF) && (!q || [u.name, u.store_name, u.email, u.phone].join(' ').toLowerCase().includes(q)))
           .sort((a, b) => { const x = val(a), y = val(b); return (x > y ? 1 : x < y ? -1 : 0) * s; });
}

    const subs = x.subscriptions || [];
    b.innerHTML = `<ul class="checks">${li('الحالة الآن', statusBadge(p.status))}${li('الخطّة', esc(p.plan))}${li('تنتهي', p.plan_expires_at ? `${fdate(p.plan_expires_at)} (${ago(p.plan_expires_at)})` : '—')}${li('نهاية التجربة', fdate(p.trial_ends_at))}
      ${li('دفع إجمالاً', usd(subs.filter(s => !['cancelled','canceled','refunded'].includes(s.status)).reduce((a, s) => a + (+s.amount_usd || 0), 0)))}</ul>
      <div class="section-t">🧾 سجل الاشتراكات</div>
      ${subs.length ? `<div class="table-wrap"><table><thead><tr><th>الخطّة</th><th>المبلغ</th><th>من</th><th>إلى</th><th>الحالة</th><th></th></tr></thead><tbody>
        ${subs.map((s, i) => `<tr><td>${esc(s.plan)}</td><td class="num"><b>${usd(s.amount_usd)}</b></td><td>${fdate(s.started_at)}</td><td>${fdate(s.expires_at)}</td>
          <td>${s.status === 'active' ? '<span class="badge b-ok">فعّال</span>' : '<span class="badge b-free">' + esc(s.status) + '</span>'}</td><td><button class="btn ghost sm" data-sub="${i}">تعديل</button></td></tr>`).join('')}
      </tbody></table></div>` : '<div class="empty" style="padding:16px">لا اشتراكات بعد</div>'}`;
    $$('[data-sub]', b).forEach(btn => btn.onclick = () => editSub(subs[+btn.dataset.sub], id));
  }
  if (t === 'dev') {
    const n = x.notifications || {}, dv = x.devices || [];
    b.innerHTML = `<div class="section-t">📱 الأجهزة</div>
      ${dv.length ? `<div class="table-wrap"><table><thead><tr><th>النظام</th><th>النسخة</th><th>آخر فتح</th><th>أوّل ظهور</th></tr></thead><tbody>
        ${dv.map(d => `<tr><td>${esc(d.platform || '—')}</td><td class="num">#${esc(d.app_build ?? '?')}</td><td>${ago(d.last_seen)}</td><td>${fdate(d.first_seen)}</td></tr>`).join('')}</tbody></table></div>`
        : '<div class="banner">⚠️ <div>لا جهاز مسجّل — لن تصله إشعارات فوريّة.</div></div>'}
      <div class="section-t">🔔 الإشعارات</div>
      <div class="kv"><div><b class="num">${n0(n.total)}</b><span>إشعار وصله</span></div><div><b class="num">${n0(n.unread)}</b><span>غير مقروء (${pc(n.unread, n.total)}%)</span></div></div>
      <ul class="checks">${Object.entries(n.by_type || {}).map(([k, v]) => li({debt:'ديون', payment:'دفعات', comment:'تعليقات', general:'عامّة'}[k] || esc(k), n0(v))).join('')}
        ${li('آخر إشعار', ago(n.last_at))}</ul>`;
  }
  if (t === 'notes') {
    const notes = x.notes || [];
    b.innerHTML = `<div class="card" style="padding:16px"><label class="f">ملاحظة جديدة (لك وحدك — لا يراها المستخدم)</label>
        <textarea id="nB" maxlength="2000" placeholder="مثلاً: اتصلت به 22/10 — سيدفع بداية الشهر"></textarea>
        <div class="form-actions"><button class="btn primary" id="nGo">حفظ الملاحظة</button></div></div>
      <div style="margin-top:14px">${notes.map(nt => `<div class="note"><p>${esc(nt.body)}</p><div style="display:flex;align-items:center;gap:8px;margin-top:8px">
        <small>${esc(nt.author)} · ${fdt(nt.created_at)}</small><div class="grow" style="flex:1"></div><button class="btn ghost sm" data-del="${nt.id}">حذف</button></div></div>`).join('') || '<div class="empty" style="padding:16px">لا ملاحظات بعد</div>'}</div>`;
    $('#nGo').onclick = async () => { const v = $('#nB').value.trim(); if (!v) return;
      try { await rpc('admin_add_note', {p_user: id, p_body: v}); toast('✅ حُفظت'); openUser(id, 'notes'); } catch(e){ toast(errText(e), true); } };
    $$('[data-del]', b).forEach(btn => btn.onclick = async () => { if (!await confirmBox('حذف الملاحظة', 'لا يمكن التراجع.', 'حذف', true)) return;
      try { await rpc('admin_delete_note', {p_id: +btn.dataset.del}); openUser(id, 'notes'); } catch(e){ toast(errText(e), true); } });
  }
  if (t === 'do') drawActions(id, p, b);
  if (t === 'log') {
    const a = x.audit || [];
    b.innerHTML = a.length ? `<div class="table-wrap"><table><thead><tr><th>الوقت</th><th>الفعل</th><th class="t">التفاصيل</th><th>بواسطة</th></tr></thead><tbody>
      ${a.map(r => { const [tt, cl] = ACT[r.action] || [r.action, 'b-free']; return `<tr><td>${fdt(r.created_at)}</td><td><span class="badge ${cl}">${esc(tt)}</span></td><td class="t" style="white-space:normal">${actDetails(r)}</td><td style="color:var(--muted)">${esc(r.actor_name || '')}</td></tr>`; }).join('')}
      </tbody></table></div>` : '<div class="empty">لا أفعال إداريّة على هذا الحساب</div>';
  }
}
function drawActions(id, p, b){
  b.innerHTML = `
    <div class="card" style="padding:16px">
      <label class="f">تفعيل اشتراك</label>
      <div class="seg" id="gPlan"><button data-v="pro">Pro</button><button data-v="business" class="on">Business</button></div>
      <div class="chips" id="gMonths" style="margin:12px 0 8px">${[1,3,6,12].map(mm => `<button class="chip ${mm === 3 ? 'on' : ''}" data-m="${mm}">${mm} ${mm === 1 ? 'شهر' : 'أشهر'}</button>`).join('')}</div>
      <div class="row"><div><label class="f">أو عدد الأشهر</label><input id="gM" type="number" min="1" max="60" value="3" class="num"></div>
        <div><label class="f">المبلغ المدفوع ($)</label><input id="gAmt" type="number" min="0" step="0.5" value="30" class="num"></div></div>
      <div class="toggle-row"><div><b style="font-size:13.5px">أضِفها إلى المدّة الحاليّة</b><div style="font-size:12px;color:var(--muted)">لا يخسر ما بقي له من أيام</div></div>
        <label class="switch"><input type="checkbox" id="gExt" checked><span></span></label></div>
      <div class="preview-box" id="gPrev"></div>
      <div class="form-actions"><button class="btn primary" id="gGo">تفعيل الاشتراك</button></div>
    </div>
    <div class="grid g2" style="margin-top:12px">
      <div class="card" style="padding:16px"><label class="f">تمديد التجربة (أيام)</label><div class="row"><input id="tDays" type="number" value="7" min="1" max="365" class="num"><button class="btn" id="tGo">تمديد</button></div></div>
      <div class="card" style="padding:16px"><label class="f">سحب الخطّة</label><button class="btn danger" id="rGo" style="width:100%;justify-content:center">إرجاعه للمجاني</button></div>
    </div>
    <div class="card" style="padding:16px;margin-top:12px">
      <label class="f">رسالة خاصّة لهذا المستخدم</label>
      <input id="mT" placeholder="العنوان" maxlength="80" style="margin-bottom:8px">
      <textarea id="mB" placeholder="النصّ — يظهر في مركز الإشعارات داخل تطبيقه" maxlength="500"></textarea>
      <div class="form-actions"><button class="btn" id="mGo">إرسال</button></div>
    </div>`;
  let plan = 'business', months = 3, amtEdited = false;
  const curExp = p.plan_expires_at ? new Date(p.plan_expires_at) : null;
  const prev = () => {
    if (!amtEdited) $('#gAmt').value = (plan === 'pro' ? 5 : 10) * months;
    const base = ($('#gExt').checked && curExp && curExp > new Date()) ? new Date(curExp) : new Date();
    base.setMonth(base.getMonth() + months);
    $('#gPrev').textContent = `${plan === 'pro' ? 'Pro' : 'Business'} · ${months} ${months === 1 ? 'شهر' : 'أشهر'} · ${usd($('#gAmt').value)} — ينتهي ${fdate(base)}`;
  };
  $$('#gPlan button').forEach(x => x.onclick = () => { plan = x.dataset.v; $$('#gPlan button').forEach(y => y.classList.toggle('on', y === x)); prev(); });
  $$('#gMonths .chip').forEach(x => x.onclick = () => { months = +x.dataset.m; $('#gM').value = months; $$('#gMonths .chip').forEach(y => y.classList.toggle('on', y === x)); prev(); });
  $('#gM').oninput = e => { const v = +e.target.value; if (v >= 1 && v <= 60) { months = v; $$('#gMonths .chip').forEach(y => y.classList.toggle('on', +y.dataset.m === v)); prev(); } };
  $('#gAmt').oninput = () => { amtEdited = true; prev(); };
  $('#gExt').onchange = prev; prev();
  $('#gGo').onclick = async () => {
    if (!await confirmBox('تفعيل اشتراك', esc($('#gPrev').textContent))) return;
    try { const exp = await rpc('admin_grant_plan_custom', {p_user: id, p_plan: plan, p_months: months, p_amount: Number($('#gAmt').value), p_extend: $('#gExt').checked});
      toast('✅ فُعّل — ينتهي ' + fdate(exp)); openUser(id, 'sub'); } catch(e){ toast(errText(e), true); } };
  $('#tGo').onclick = async () => { const days = +$('#tDays').value;
    if (!await confirmBox('تمديد التجربة', `إضافة ${days} يوماً إلى تجربته.`)) return;
    try { const t2 = await rpc('admin_extend_trial', {p_user: id, p_days: days}); toast('✅ التجربة حتى ' + fdate(t2)); openUser(id, 'sub'); } catch(e){ toast(errText(e), true); } };
  $('#rGo').onclick = async () => {
    if (!await confirmBox('سحب الخطّة', 'سيعود الحساب إلى المجاني فوراً، وتُلغى اشتراكاته الفعّالة.', 'سحب الخطّة', true)) return;
    try { await rpc('admin_revoke_plan', {p_user: id}); toast('أُرجع إلى المجاني'); openUser(id, 'sub'); } catch(e){ toast(errText(e), true); } };
  $('#mGo').onclick = async () => {
    const t3 = $('#mT').value.trim(), bb = $('#mB').value.trim();
    try { const r = await rpc('admin_broadcast', {p_segment: 'single', p_title: t3, p_body: bb, p_user: id});
      const push = await pushTo(r.user_ids || [], t3, bb);
      toast(`✅ وصلت لمركز إشعاراته${push.sent ? ' · وإلى جواله' : ''}`); $('#mT').value = ''; $('#mB').value = '';
    } catch(e){ toast(errText(e), true); } };
}

/* ═══ أسماء أفعال السجلّ الجديدة ═══ */
Object.assign(ACT, {add_note:['ملاحظة','b-next'], delete_note:['حذف ملاحظة','b-free'], resend_push:['إعادة إرسال','b-pro']});

/* ═══ اختصار: «/» للبحث ═══ */
document.addEventListener('keydown', e => {
  if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '')) { e.preventDefault(); $('#gSearch').focus(); }
});

if (DEMO) { $('#login').style.display='none'; }
boot();
</script>
</body>
</html>
